<meta charset="utf-8">
<title>Layout de Gastos Trivasa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F8FAFC;--panel:#FFFFFF;--ink:#1F2937;--mute:#64748B;--line:#E2E8F0;--band:#EBEDEF;--accent:#FF8000;--accent-ink:#FFFFFF;--first:#FFF7ED;--neg:#B91C1C;--hl:#FFEDD5;--foot:#2E3F50;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.4 Roboto,system-ui,sans-serif}
.top{margin:6px 12px 0;background:var(--panel);box-shadow:0 2px 4px rgba(0,0,0,.1);height:52px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border:1px solid var(--line)}.top .l{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}.burger{width:30px;height:30px;background:var(--accent);border-radius:6px;display:grid;place-items:center}.burger i{display:block;width:12px;height:2px;background:#fff;box-shadow:0 -4px #fff,0 4px #fff}.top .u{color:var(--ink)}.foot{background:var(--foot);color:#fff;height:42px;display:flex;align-items:center;padding-left:200px;margin-top:8px}.wrap{max-width:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
h1{margin:0;font-size:13px;font-weight:700}
.card{margin:12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:14px}.sub{color:var(--mute);margin-top:2px;max-width:70ch}
.kpis{display:flex;border:1px solid var(--line);background:var(--panel);border-radius:6px;overflow:hidden}
.kpi{padding:8px 16px;border-right:1px solid var(--line);min-width:118px}
.kpi:last-child{border-right:0}
.kpi b{display:block;font:500 16px "Roboto Mono",monospace;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:500;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer}.btn:hover{filter:brightness(.93)}.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}.chip{font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);padding:5px 11px;cursor:pointer;display:flex;gap:7px;align-items:center}
.chip.cs{padding:0;gap:0;overflow:hidden}.chip.cs>button{font:inherit;color:inherit;background:none;border:0;padding:5px 8px 5px 11px;cursor:pointer;display:flex;gap:7px;align-items:center}.chip.cs select{font:12px inherit;color:inherit;background:transparent;border:0;border-left:1px solid currentColor;padding:5px 6px;margin:0;cursor:pointer;max-width:200px}.chip.cs select option{color:var(--ink);background:var(--panel)}.chip.cs>button:focus-visible,.chip.cs select:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.chip i{width:9px;height:9px;display:inline-block}
.chip small{color:var(--mute);font:11px "Roboto Mono",monospace}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.chip:focus-visible,input:focus-visible,.vp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{font:inherit;padding:6px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);min-width:240px}
.sp{flex:1}
label.t{display:flex;gap:6px;align-items:center;color:var(--mute);cursor:pointer}
.grid{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.vp{flex:1;overflow:auto;position:relative}
.hd{position:sticky;top:0;z-index:5;background:var(--panel)}
.row{display:flex;height:26px;align-items:center;position:absolute;left:0;min-width:100%}
.hrow{display:flex;position:relative}
.c{flex:none;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;height:100%;display:flex;align-items:center}
.c.n{justify-content:flex-end;font:12px "Roboto Mono",monospace;font-variant-numeric:tabular-nums}
.c.neg{color:var(--neg)}
.hrow .c{background:var(--band);font-weight:600;font-size:11px;text-transform:uppercase;border-right:1px solid var(--line);height:34px;white-space:normal;line-height:1.15}
.hrow.g .c{height:22px;color:var(--mute);background:var(--panel);border-bottom:1px solid var(--line);font-size:10.5px}
.sticky{position:sticky;z-index:3;background:inherit}
.hrow .sticky{background:var(--band)}
.hrow.g .sticky{background:var(--panel)}
.r{background:var(--panel)}
.r.first{background:var(--first);border-top:1px solid var(--line)}
.r.first .fo{font-weight:600}
.r:not(.first) .c{color:var(--ink)}
.r:hover{background:var(--hl)}
.tag.lt{color:var(--ink)}
.tag{font-size:11px;font-weight:600;padding:1px 7px;color:#fff;letter-spacing:.02em}
.empty{padding:40px;text-align:center;color:var(--mute)}
footer{color:var(--mute);font-size:12px;display:flex;gap:18px;flex-wrap:wrap}
footer b{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:no-preference){.chip{transition:background .12s}}

.vp{overflow:auto;max-height:72vh;min-height:360px}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th,td{padding:0 8px;height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;border-bottom:1px solid var(--line);text-align:left}
thead th{position:sticky;background:var(--band);text-transform:none;letter-spacing:0;z-index:4;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-right:1px solid var(--line);white-space:normal;line-height:1.15;height:36px}
thead tr.g th{top:0;height:22px;background:var(--panel);color:var(--mute);font-size:10.5px}
thead tr.h th{top:22px}
td.n,th.n{text-align:right;font:12px "Roboto Mono",monospace;font-variant-numeric:tabular-nums}
td.neg{color:var(--neg)}
td.stk,th.stk{position:sticky;z-index:3}
thead th.stk{z-index:6}
tr.r td{background:var(--panel)}
tr.first td{background:var(--first);border-top:2px solid var(--line)}
tr.first td.fo{font-weight:600}
tr.r:hover td{background:var(--hl)}
.pg{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);color:var(--mute)}
.pg button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 12px;cursor:pointer}
.pg button:disabled{opacity:.4;cursor:default}
.st{color:var(--mute);font:12px "Roboto Mono",monospace}.st.busy{color:var(--accent)}.st.err{color:var(--neg)}select{font:inherit;padding:5px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}input[type=date]{font:inherit;padding:5px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.btn:disabled{opacity:.5;cursor:wait}
</style>
<div class="top"><div class="l"><span class="burger"><i></i></span>Trivasa</div><div class="u">ESTEBAN HERNAN ALCOCER SOUZA</div></div>
<div class="wrap"><div class="card">
<header>
 <div><h1>Reporte de Auditoria</h1><div style="margin-top:10px;display:flex;gap:40px;flex-wrap:wrap"><div><b>Empresa:</b> TRIVASA S.A. DE C.V.<br><b>Origen:</b> TODOS</div><div><b>Fuente:</b> .207 · TRIVASADB (producción)</div></div>
 <div class="sub" id="sub" style="margin-top:10px"></div></div>
 <div class="kpis" id="kpis"></div>
</header>
<div class="bar" id="ctl"><label class="t">Fecha inicio <input type="date" id="fi" value="2026-01-01"></label><label class="t">Fecha final <input type="date" id="ff" value="2026-01-31"></label><label class="t">Vista <select id="vista"><option value="layout">Layout por documento</option><option value="ceco">Análisis por CECO</option></select></label><label class="t" id="agrl"><input type="checkbox" id="agr" checked> Agrupar por cuenta contable</label><button class="btn" id="go">Consultar</button><button class="chip" id="rf" title="Ignora el caché y vuelve a consultar .207">Actualizar desde .207</button><span class="st" id="st"></span></div>
<div class="bar" role="group" aria-label="Filtrar por tipo"><span id="chips" style="display:contents"></span></div>
<div class="bar">
 <input type="search" id="q" placeholder="Buscar folio, proveedor, RFC, UUID, cuenta…" aria-label="Buscar">
 <label class="t"><input type="checkbox" id="only"> Solo primera fila de cada documento</label>
 <span class="sp"></span><button class="btn" id="xl" title="Exporta las filas que ve con el filtro actual">Exportar a Excel</button><span id="count" style="color:var(--mute);font:12px 'Roboto Mono',monospace"></span>
</div>
<div class="grid"><div class="vp" id="vp" tabindex="0"><table id="tb"><colgroup id="cg"></colgroup><thead id="hd"></thead><tbody id="body"></tbody></table></div><div class="pg" id="pg"></div></div>
<footer id="foot"></footer>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const PRE=/*DATA*/null;
const $=id=>document.getElementById(id);
function init(D){
const RH=26,meta=D.meta||{},vista=D.vista||'layout',agrupado=!!D.agrupar;
const TIPO={'Gasto':'#0F766E','Compra':'#A16207','Indirecto':'#C2410C','NC proveedor':'#BE185D','CxP libre':'#7A4EA3','CxP orden compra':'#78350F'};
// Gasto: rampa fría (teal, cielo, azul, índigo), cada matiz en tono oscuro (texto blanco) y claro (l=1, texto oscuro)
const ORI={registro_gasto:['Registro de gasto','#0F766E'],comprobacion_gasto:['Comprobación de gasto','#5EEAD4',1],orden_compra:['Orden de compra','#0369A1'],consumo_interno:['Consumo interno','#7DD3FC',1],viaje:['Viaje','#1D4ED8'],control_combustible:['Control de combustible','#93C5FD',1],gasto_reclasificacion:['Gasto reclasificación','#4338CA'],gasto_registro_nomina:['Nómina','#A5B4FC',1]};
// la etiqueta de Tipo absorbe el origen: Gasto · origen, CxP · Libre/Orden Compra; el resto, solo el tipo
const lbl=(t,o)=>t=='Gasto'&&o?'Gasto · '+(ORI[o]?ORI[o][0]:o):t=='CxP libre'?'CxP · Libre':t=='CxP orden compra'?'CxP · Orden Compra':t;
const tOf=[],oOf=[];
const cols=D.cols.filter(c=>c.k!='ORIGEN');
const rows=(function(){const c0=D.cols,T0=c0.findIndex(c=>c.k=='Tipo'),O0=c0.findIndex(c=>c.k=='ORIGEN'),F0=c0.findIndex(c=>c.k=='FOLIO');
 let k0=null,cT=null,cO=null;
 return D.rows.map((r,i)=>{const k=r[T0]+'|'+r[F0];if(k!==k0){k0=k;cT=r[T0];cO=O0<0?null:r[O0]}tOf[i]=cT;oOf[i]=cO;
  const n=r.slice();n[T0]=lbl(cT,cO);if(O0>=0)n.splice(O0,1);return n})})();
const ix={};cols.forEach((c,i)=>ix[c.k]=i);
const W={Tipo:230,FOLIO:92,POLIZA:120,FECHA_POLIZA:104,CONCEPTO_POLIZA:300,CUENTA_REGISTRO:130,NOMBRE_CUENTA_REGISTRO:230,CECO:70,CARGO:110,ABONO:110,FECHA:104,MONEDA:64,CLAVE_PROVEEDOR:80,RFC_PROVEEDOR:130,NOMBRE_PROVEEDOR:260,TIPO_COMPROBANTE:190,UUID:300,NOMBRE_CUENTA:200,CONCEPTO_GASTO:260,DESCRIPCION_USO_BIEN_SERVICIO:240,FORMA_PAGO:200,XML_FORMA_PAGO:230,XML_METODO_PAGO:200,COMPLEMENTO_PAGO:300,REFERENCIA:170,BANCO:130,CUENTA_BANCARIA:130,NO_CHEQUE_TRANSF:150,NUMERO_FACTURA:120,XML_RFC_EMISOR:130};
cols.forEach(c=>c.w=c.k=='FECHA_FACTURA'||c.k=='FECHA_CHEQUE'?104:W[c.k]||(c.t=='n'?116:110));
const total=cols.reduce((a,c)=>a+c.w,0);
// columnas fijas a la izquierda: Tipo (con origen) y FOLIO
const stk={};let off=0;['Tipo','FOLIO'].forEach(k=>{if(k in ix){stk[k]=off;off+=cols[ix[k]].w}});
$('sub').textContent=vista=='ceco'
 ?'Análisis por CECO: una línea por cuenta contable de la póliza; subtotales e impuestos se reparten entre las líneas de un mismo CECO y el TOTAL se calcula por línea.'
 :'Una fila por documento con sus importes (subtotales, impuestos, total, XML y cobro); si tiene varias líneas de póliza, las siguientes solo llevan el folio, la cuenta, el CECO, el cargo y el abono'+(agrupado?', sumadas por cuenta contable.':'.');
// group header
const hd=document.getElementById('hd');
document.getElementById('cg').innerHTML=cols.map(c=>'<col style="width:'+c.w+'px">').join('');
document.getElementById('tb').style.width=total+'px';
(function(){let g='<tr class="g">',h='<tr class="h">',i=0;
 while(i<cols.length){let j=i;while(j<cols.length&&cols[j].g==cols[i].g)j++;g+='<th colspan="'+(j-i)+'">'+cols[i].g+'</th>';i=j}
 cols.forEach(c=>{const s=c.k in stk?' stk" style="left:'+stk[c.k]+'px':'';h+='<th class="'+(c.t=='n'?'n':'')+s+'">'+c.l+'</th>'});
 hd.innerHTML=g+'</tr>'+h+'</tr>'})();
const fmt=new Intl.NumberFormat('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>fmt.format(v);
const ti=ix.Tipo,fi=ix.FOLIO,ci=ix.CARGO,ai=ix.ABONO,si=ix.SUBTOTAL_NETO,toi=ix.TOTAL;
// llave de documento = Tipo + folio (un folio puede repetirse entre tipos)
const kOf=rows.map(r=>r[ti]+'|'+r[fi]);
const first=new Uint8Array(rows.length);let last=null;kOf.forEach((k,i)=>{if(k!==last){first[i]=1;last=k}});
const fol=new Map();rows.forEach((r,i)=>{const k=kOf[i],f=fol.get(k)||{c:0,a:0,s:0};f.c+=r[ci]||0;f.a+=r[ai]||0;f.s+=r[si]||0;fol.set(k,f)});
let selT=new Set(),selO='',query='',only=false,view=[];
const chips=$('chips'),ori=document.createElement('select');ori.setAttribute('aria-label','Origen del gasto');
const cntT={},cntO={};rows.forEach((r,i)=>{if(first[i]){cntT[tOf[i]]=(cntT[tOf[i]]||0)+1;if(tOf[i]=='Gasto')cntO[oOf[i]]=(cntO[oOf[i]]||0)+1}});
function chip(box,html,pressed,fn){const b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',pressed);b.innerHTML=html;b.onclick=fn;box.appendChild(b)}
function mkChips(){chips.innerHTML='';
 chip(chips,'Todos <small>'+fol.size+'</small>',selT.size==0&&!selO,()=>{selT.clear();selO='';apply()});
 Object.keys(TIPO).forEach(k=>{if(!cntT[k])return;
  const f=()=>{if(selT.has(k)){selT.delete(k);if(k=='Gasto')selO=''}else selT.add(k);apply()};
  const h='<i style="background:'+TIPO[k]+'"></i>'+k+' <small>'+cntT[k]+'</small>';
  if(k!='Gasto'||!Object.keys(cntO).length){chip(chips,h,selT.has(k),f);return}
  const d=document.createElement('div');d.className='chip cs';d.setAttribute('aria-pressed',selT.has(k));
  const b=document.createElement('button');b.innerHTML=h;b.onclick=f;d.appendChild(b);d.appendChild(ori);chips.appendChild(d)})}
ori.innerHTML='<option value="">Todos los orígenes</option>'+Object.keys(ORI).filter(k=>cntO[k]).map(k=>'<option value="'+k+'">'+ORI[k][0]+' ('+cntO[k]+')</option>').join('');
ori.onchange=()=>{selO=ori.value;if(selO)selT.add('Gasto');apply()};
function apply(){mkChips();ori.value=selO;const q=query.toLowerCase();view=[];
 let ok=null;
 if(q){ok=new Set();rows.forEach((r,i)=>{const k=kOf[i];if(!ok.has(k)){for(const v of r){if(v!=null&&String(v).toLowerCase().includes(q)){ok.add(k);break}}}})}
 const useO=!!selO&&selT.has('Gasto');
 for(let i=0;i<rows.length;i++){const t=tOf[i];
  if(selT.size&&!selT.has(t))continue;
  if(useO&&t!='Gasto'&&!selT.has(t))continue;
  if(useO&&t=='Gasto'&&oOf[i]!==selO)continue;
  if(ok&&!ok.has(kOf[i]))continue;if(only&&!first[i])continue;view.push(i)}
 let c=0,a=0,s=0,tt=0,fs=new Set();view.forEach(i=>{const r=rows[i];c+=r[ci]||0;a+=r[ai]||0;s+=r[si]||0;tt+=toi==null?0:r[toi]||0;fs.add(kOf[i])});
 let okc=0;fs.forEach(f=>{const x=fol.get(f);if(Math.abs(x.c-x.a-x.s)<=0.05)okc++});
 $('kpis').innerHTML=[['Documentos',fs.size.toLocaleString('es-MX')],['Líneas',view.length.toLocaleString('es-MX')],['Σ Cargo',money(c)],['Σ Abono',money(a)],['Σ Subtotal neto',money(s)],['Σ Total',money(tt)],['Documentos cuadrados',okc+' / '+fs.size]].map(k=>'<div class="kpi"><b>'+k[1]+'</b><span>'+k[0]+'</span></div>').join('');
 page=0;$('count').textContent=view.length.toLocaleString('es-MX')+' filas';draw()}
const vp=document.getElementById('vp'),body=document.getElementById('body'),PS=300;let page=0;
function draw(){const pages=Math.max(1,Math.ceil(view.length/PS));page=Math.min(page,pages-1);
 const s=page*PS,e=Math.min(view.length,s+PS);
 if(!view.length){body.innerHTML='<tr><td colspan="'+cols.length+'" class="empty">Ningún documento coincide con el filtro.</td></tr>'}
 else{let h='';for(let p=s;p<e;p++){const i=view[p],r=rows[i],f=first[i];
  h+='<tr class="r'+(f?' first':'')+'">';
  for(let k=0;k<cols.length;k++){const c=cols[k],v=r[k];let t='',cl=c.t=='n'?'n':'';
   if(c.k=='Tipo'){if(v!=null){const o=tOf[i]=='Gasto'?ORI[oOf[i]]:null;t='<span class="tag'+(o&&o[2]?' lt':'')+'" style="background:'+(o?o[1]:TIPO[tOf[i]]||'#64748B')+'">'+v+'</span>'}}
   else if(v!=null){if(c.t=='n'){if(v===0&&c.g=='Impuestos'){}else t=money(v);if(v<0)cl+=' neg'}else t=String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
   if(c.k=='FOLIO')cl+=' fo';
   let sty='';if(c.k in stk){cl+=' stk';sty=' style="left:'+stk[c.k]+'px"'}
   h+='<td class="'+cl+'"'+sty+'>'+t+'</td>'}
  h+='</tr>'}
 body.innerHTML=h}
 const pg=document.getElementById('pg');pg.innerHTML='<button id="pp"'+(page==0?' disabled':'')+'>← Anterior</button><span>Filas '+(view.length?s+1:0)+'–'+e+' de '+view.length.toLocaleString('es-MX')+' · página '+(page+1)+' de '+pages+'</span><button id="pn"'+(page>=pages-1?' disabled':'')+'>Siguiente →</button>';
 document.getElementById('pp').onclick=()=>{page--;draw();vp.scrollTop=0};document.getElementById('pn').onclick=()=>{page++;draw();vp.scrollTop=0}}
document.getElementById('q').oninput=e=>{query=e.target.value.trim();clearTimeout(window._t);window._t=setTimeout(apply,200)};
document.getElementById('only').onchange=e=>{only=e.target.checked;apply()};
$('foot').innerHTML='<span><b>Tipo</b>: Gasto (con su origen), Compra, Indirecto, NC proveedor o CxP (Libre u Orden Compra: inversión que parte de una OC y genera CxP). Las notas de crédito van en negativo.</span><span><b>Subtotal neto</b> ya descuenta descuentos; <b>Cargo</b> = importes positivos de la póliza y <b>Abono</b> = negativos en valor absoluto.</span>'+(vista=='ceco'?'<span>Subtotal neto e impuestos se reparten entre las líneas de póliza de un mismo CECO, sin duplicarse.</span>':'<span>Los importes del documento aparecen solo en su primera fila, por lo que las sumas de columna no duplican.</span>')+'<span>Solo se muestran las columnas con algún dato en el periodo.</span>';
apply();

function exportar(){
 const n=cols.length,A=[];
 const emp='TRIVASA S.A. DE C.V.',ini=meta.ini||'',fin=meta.fin||'';
 const dm=s=>s?s.split('-').reverse().join('-'):'';
 A.push(['Empresa:',emp]);A.push(['Fecha inicial:',dm(ini)]);A.push(['Fecha final:',dm(fin)]);
 A.push(['Vista:',vista=='ceco'?'Análisis por CECO':'Layout por documento'+(agrupado?' (agrupado por cuenta contable)':'')]);
 A.push([]);
 A.push(cols.map((c,j)=>j+1));
 const rHd=A.length;A.push(cols.map(c=>c.l));
 const r0=A.length;
 view.forEach(i=>{const r=rows[i];A.push(r.map((v,j)=>v==null?null:(cols[j].t=='n'?Number(v):v)))});
 const r1=A.length-1;
 const noSuma=vista=='ceco'?['XML_MONTO','MONTO_COBRADO']:[];
 const suma=cols.map(c=>c.t=='n'&&!noSuma.includes(c.k));
 const sums=cols.map((c,j)=>{if(!suma[j])return 0;let x=0;for(let r=r0;r<=r1;r++)x+=A[r][j]||0;return Math.round(x*100)/100});
 A.push(cols.map((c,j)=>j==0?'TOTAL':null));const rTot=A.length-1;
 const nom='reporte_auditoria_'+(ini&&fin?ini+'_'+fin:new Date().toISOString().slice(0,10));
 if(window.XLSX){
  const ws=XLSX.utils.aoa_to_sheet(A);
  const L=j=>XLSX.utils.encode_col(j);
  cols.forEach((c,j)=>{if(c.t=='n'){for(let r=r0;r<=r1;r++){const x=ws[XLSX.utils.encode_cell({r,c:j})];if(x)x.z='#,##0.00'}
   if(suma[j]&&r1>=r0)ws[XLSX.utils.encode_cell({r:rTot,c:j})]={t:'n',f:'SUBTOTAL(109,'+L(j)+(r0+1)+':'+L(j)+(r1+1)+')',v:sums[j],z:'#,##0.00'}}});
  ws['!cols']=cols.map(c=>({wch:Math.max(10,Math.round(c.w/7))}));
  ws['!freeze']={xSplit:Object.keys(stk).length,ySplit:rHd+1};
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:rHd,c:0},e:{r:r1,c:n-1}})};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Reporte');XLSX.writeFile(wb,nom+'.xlsx');
 }else{
  A[rTot]=cols.map((c,j)=>j==0?'TOTAL':(suma[j]?sums[j]:null));
  const q=v=>v==null?'':'"'+String(v).replace(/"/g,'""')+'"';
  const blob=new Blob(['\ufeff'+A.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom+'.csv';a.click();
 }}
document.getElementById('xl').onclick=exportar;
}
async function cargar(refresh){
 const ini=$('fi').value,fin=$('ff').value,st=$('st'),btn=$('go');
 if(!ini||!fin){st.textContent='Indica fecha inicio y fecha final.';return}
 btn.disabled=true;st.className='st busy';st.textContent='Consultando .207…';
 const t0=performance.now();
 try{
  const r=await fetch('api/reporte?ini='+ini+'&fin='+fin+'&vista='+$('vista').value+'&agrupar='+($('agr').checked?1:0)+(refresh?'&refresh=1':''),{cache:'no-store'});
  if(!r.ok)throw new Error((await r.text())||r.status);
  const t1=performance.now(),D=await r.json(),t2=performance.now();
  init(D);const t3=performance.now(),m=D.meta||{};
  st.className='st';
  st.textContent=(m.cache?'Desde caché del servidor':'Consulta en vivo a '+m.fuente)+' · datos de '+m.generado+(m.cache?'':' ('+m.seg_consulta+' s de consulta')+(m.cache?'':')')+' · descarga '+((t1-t0)/1000).toFixed(2)+' s · render '+((t3-t2)/1000).toFixed(2)+' s';
  window.__tiempos={fetch_ms:Math.round(t1-t0),parse_ms:Math.round(t2-t1),render_ms:Math.round(t3-t2),total_ms:Math.round(t3-t0),cache:!!m.cache,filas:D.rows.length};
 }catch(e){st.className='st err';st.textContent='Error: '+e.message}
 btn.disabled=false}
const syncAgr=()=>{$('agr').disabled=$('vista').value=='ceco';$('agrl').style.opacity=$('agr').disabled?.5:1};
$('vista').onchange=()=>{syncAgr();cargar(false)};$('agr').onchange=()=>cargar(false);syncAgr();
$('go').onclick=()=>cargar(false);$('rf').onclick=()=>cargar(true);
if(PRE){$('ctl').hidden=true;init(PRE)}else{const q=new URLSearchParams(location.search);if(q.get('ini'))$('fi').value=q.get('ini');if(q.get('fin'))$('ff').value=q.get('fin');if(q.get('vista')=='ceco'){$('vista').value='ceco';syncAgr()}cargar(false)}
</script>
