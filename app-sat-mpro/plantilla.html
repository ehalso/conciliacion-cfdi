<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conciliación SAT vs MPRO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#F5F7FA;--card:#fff;--tx:#1F2A37;--mut:#64748B;--bd:#E2E8F0;--acc:#FF8000;--foot:#2E3F50;--hov:#FFF4E8;
--ok:#16A34A;--okb:#DCFCE7;--dif:#D97706;--difb:#FEF3C7;--fsm:#DC2626;--fsmb:#FEE2E2;--fsat:#7C3AED;--fsatb:#EDE9FE;--nom:#64748B;--nomb:#E8EDF3;--pen:#2563EB;--penb:#DBEAFE;--can:#0F766E;--canb:#CCFBF1;--th:#EEF2F6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141C26;--card:#1C2733;--tx:#E5EBF1;--mut:#94A3B8;--bd:#2F3D4C;--hov:#2A2F36;--okb:#14352300;--th:#243140;--okb:#12351F;--difb:#3A2E10;--fsmb:#3F1A1A;--fsatb:#2B2145;--nomb:#2A3643;--canb:#0F3330;--ok:#4ADE80;--dif:#FBBF24;--fsm:#F87171;--fsat:#A78BFA;--nom:#94A3B8;--can:#2DD4BF;--pen:#60A5FA;--penb:#172A4A}}
:root[data-theme=dark]{--bg:#141C26;--card:#1C2733;--tx:#E5EBF1;--mut:#94A3B8;--bd:#2F3D4C;--hov:#2A2F36;--th:#243140;--okb:#12351F;--difb:#3A2E10;--fsmb:#3F1A1A;--fsatb:#2B2145;--nomb:#2A3643;--canb:#0F3330;--ok:#4ADE80;--dif:#FBBF24;--fsm:#F87171;--fsat:#A78BFA;--nom:#94A3B8;--can:#2DD4BF;--pen:#60A5FA;--penb:#172A4A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.45 Roboto,system-ui,sans-serif}
header{background:var(--foot);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:500}header h1 b{color:var(--acc)}header .sub{color:#B8C4D0;font-size:11px;margin-left:auto}
main{padding:16px 20px;display:flex;flex-direction:column;gap:14px;max-width:1700px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit}
.kpi:hover,.kpi.on{border-color:var(--acc);background:var(--hov)}
.kpi .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.kpi .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .m{color:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.kpi .bar{height:4px;border-radius:2px;background:var(--bd);margin-top:6px;overflow:hidden}.kpi .bar i{display:block;height:100%}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:1000px){.row2{grid-template-columns:1fr}}
.pnl{padding:12px 14px}.pnl h2{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:500}
.meses{display:flex;flex-direction:column;gap:5px}.mes{display:grid;grid-template-columns:62px 1fr 56px;gap:8px;align-items:center;cursor:pointer;border-radius:4px;padding:1px 2px}
.mes:hover,.mes.on{background:var(--hov)}.mes .t{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--bd)}.mes .t i{display:block;height:100%}
.mes span.p{text-align:right;font-variant-numeric:tabular-nums;color:var(--mut)}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;color:var(--mut);font-size:11px}.leg b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.top{display:flex;flex-direction:column;gap:3px}.top div{display:grid;grid-template-columns:1fr auto;gap:8px;cursor:pointer;padding:2px 4px;border-radius:4px}.top div:hover{background:var(--hov)}.top small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top div span{font-variant-numeric:tabular-nums;font-weight:500}
.tools{padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:flex;border:1px solid var(--bd);border-radius:6px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--tx);padding:6px 12px;font:inherit;cursor:pointer;border-right:1px solid var(--bd)}.seg button:last-child{border:0}.seg button.on{background:var(--acc);color:#fff}
input,select{font:inherit;border:1px solid var(--bd);border-radius:6px;padding:6px 8px;background:var(--card);color:var(--tx)}input[type=search]{min-width:240px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 14px;font:inherit;font-weight:500;cursor:pointer}.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chip{border:1px solid var(--bd);border-radius:12px;padding:3px 10px;cursor:pointer;background:var(--card);color:var(--tx);font:inherit;display:inline-flex;gap:6px;align-items:center}
.chip.on{border-color:var(--acc);background:var(--hov)}.chip b{font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:500;white-space:nowrap}
.OK{background:var(--okb);color:var(--ok)}.DIF{background:var(--difb);color:var(--dif)}.FSM{background:var(--fsmb);color:var(--fsm)}.FSAT{background:var(--fsatb);color:var(--fsat)}.NOM{background:var(--nomb);color:var(--nom)}.PEN{background:var(--penb);color:var(--pen)}.CAN{background:var(--canb);color:var(--can)}
.tw{overflow:auto;max-height:68vh}table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:var(--th);text-align:left;padding:7px 8px;font-weight:500;border-bottom:1px solid var(--bd);white-space:nowrap;cursor:pointer;user-select:none}
td{padding:5px 8px;border-bottom:1px solid var(--bd);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}tbody tr{cursor:pointer}tbody tr:hover{background:var(--hov)}.r{text-align:right;font-variant-numeric:tabular-nums}.u{font-family:ui-monospace,monospace;font-size:11px}
.pg{display:flex;gap:10px;align-items:center;padding:8px 14px;color:var(--mut)}
#dr{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--card);border-left:1px solid var(--bd);box-shadow:-6px 0 20px #0003;padding:16px;overflow:auto;transform:translateX(105%);transition:transform .18s}#dr.on{transform:none}
#dr h3{margin:0 0 4px;font-size:14px}#dr dl{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;margin:12px 0}#dr dt{color:var(--mut)}#dr dd{margin:0;word-break:break-all}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.cmp div{border:1px solid var(--bd);border-radius:6px;padding:8px}.cmp small{color:var(--mut);display:block}.cmp b{font-size:16px;font-variant-numeric:tabular-nums}
.note{padding:10px 14px;color:var(--mut)}
footer{background:var(--foot);color:#B8C4D0;padding:10px 20px;font-size:11px}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
</style></head><body>
<header><h1><b>Trivasa</b> · Conciliación SAT vs MPRO</h1>
<div class="seg" id="theme"><button data-t="auto">Auto</button><button data-t="light">Claro</button><button data-t="dark">Oscuro</button></div>
<span class="sub" id="gen"></span></header>
<main>
<div class="kpis" id="kpis"></div>
<div class="row2">
 <div class="card pnl"><h2>Avance de conciliación por mes</h2><div class="meses" id="meses"></div><div class="leg" id="leg"></div></div>
 <div class="card pnl"><h2>Contrapartes con más pendientes</h2><div class="top" id="top"></div></div>
</div>
<div class="card">
 <div class="tools">
  <div class="seg" id="dir"><button data-v="">Todos</button><button data-v="E">Emitidos</button><button data-v="R">Recibidos</button></div>
  <select id="tc"><option value="">Todos los tipos</option><option value="I">I · Ingreso</option><option value="E">E · Egreso</option><option value="P">P · Pago</option><option value="T">T · Traslado</option><option value="N">N · Nómina</option></select>
  <select id="mes"><option value="">Todos los meses</option></select>
  <input type="search" id="q" placeholder="Buscar UUID, RFC, nombre, folio o documento MPRO">
  <span style="flex:1"></span>
  <button class="btn g" id="clr">Limpiar filtros</button><button class="btn" id="xls">Exportar a Excel</button>
 </div>
 <div class="chips" id="chips"></div>
 <div class="note" id="aviso" hidden></div>
 <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
 <div class="pg"><button class="btn g" id="pv">‹</button><span id="pi"></span><button class="btn g" id="nx">›</button><span id="cnt" style="margin-left:auto"></span></div>
</div>
</main>
<aside id="dr" aria-label="Detalle"></aside>
<footer>Fuente SAT: Descarga Masiva (raw_sat_api.cfdi) · Fuente MPRO: Comprobante_Digital · Cruce por UUID · Tolerancia de importe $1.00</footer>
<script>
const D=__DATA__;
const EST={OK:'Conciliado',DIF:'Con diferencias',FSM:'Falta en MPRO',FSAT:'Falta en SAT',CAN:'Cancelado en MPRO',NOM:'Nómina (fuera de MPRO)',PEN:'Pendiente de carga en MPRO'};
const ORD=['OK','FSM','FSAT','DIF','CAN','PEN','NOM'],COL={PEN:'--pen',OK:'--ok',FSM:'--fsm',FSAT:'--fsat',DIF:'--dif',CAN:'--can',NOM:'--nom'};
const TCN={I:'Ingreso',E:'Egreso',P:'Pago',T:'Traslado',N:'Nómina'};
const ix={};D.cols.forEach((c,i)=>ix[c]=i);let rows,full=true;(D.agg||[]).forEach(([d,tc,m,e,n])=>{const r=[null,d,tc,'',m,'','','',null,null,'',e,'','',''];for(let i=0;i<n;i++)D.rows.push(r)});rows=D.rows.slice();
const S={dir:'',tc:'',mes:'',q:'',est:new Set(),page:0,sort:null,asc:true};
const $=id=>document.getElementById(id),fm=n=>n==null?'':n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2}),fi=n=>n.toLocaleString('es-MX');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function base(){const q=S.q.trim().toLowerCase();return rows.filter(r=>(!S.dir||r[1]==S.dir)&&(!S.tc||r[2]==S.tc)&&(!S.mes||r[4]==S.mes)&&(!q||(r[0]+' '+r[5]+' '+r[6]+' '+r[7]+' '+r[12]).toLowerCase().includes(q)))}
function cnt(rs){const c={};ORD.forEach(k=>c[k]=0);rs.forEach(r=>c[r[11]]++);return c}
function render(){
 const b=base(),c=cnt(b),tot=b.length,rel=tot-c.NOM;
 $('kpis').innerHTML=`<button class="card kpi ${S.est.size?'':'on'}" data-e=""><span class="l">Total comprobantes</span><span class="n">${fi(tot)}</span><span class="m">${fi(rel)} sin nómina</span></button>`+
 ORD.filter(k=>(k!='NOM'&&k!='PEN')||c[k]).map(k=>`<button class="card kpi ${S.est.has(k)?'on':''}" data-e="${k}"><span class="l">${EST[k]}</span><span class="n" style="color:var(${COL[k]})">${fi(c[k])}</span><span class="m">${(100*c[k]/(k=='NOM'?tot:rel||1)).toFixed(1)}% ${k=='NOM'?'del total':'sin nómina'}</span><span class="bar"><i style="width:${100*c[k]/(tot||1)}%;background:var(${COL[k]})"></i></span></button>`).join('');
 const ms={};D.rows.forEach(r=>{if(!(!S.dir||r[1]==S.dir)||(S.tc&&r[2]!=S.tc))return;(ms[r[4]]=ms[r[4]]||[]).push(r)});
 $('meses').innerHTML=Object.keys(ms).sort().map(m=>{const cc=cnt(ms[m]),t=ms[m].length-cc.NOM||1;return `<div class="mes ${S.mes==m?'on':''}" data-m="${m}"><span>${m}</span><div class="t">${ORD.filter(k=>k!='NOM').map(k=>`<i title="${EST[k]}: ${cc[k]}" style="width:${100*cc[k]/t}%;background:var(${COL[k]})"></i>`).join('')}</div><span class="p">${(100*cc.OK/t).toFixed(0)}%</span></div>`}).join('');
 $('leg').innerHTML=ORD.filter(k=>k!='NOM').map(k=>`<span><b style="background:var(${COL[k]})"></b>${EST[k]}</span>`).join('');
 const tp={};b.filter(r=>r[11]=='FSM'||r[11]=='FSAT'||r[11]=='DIF').forEach(r=>{const k=r[5];(tp[k]=tp[k]||{n:0,t:0,nm:r[6]});tp[k].n++;tp[k].t+=(r[8]??r[9]??0)});
 $('top').innerHTML=Object.entries(tp).sort((a,b)=>b[1].n-a[1].n).slice(0,8).map(([k,v])=>`<div data-r="${k}"><span><small>${esc(v.nm||'—')}</small>${k}</span><span>${fi(v.n)}<small>$${fm(v.t)}</small></span></div>`).join('')||'<div class="note">Sin pendientes</div>';
 $('chips').innerHTML=ORD.map(k=>`<button class="chip ${S.est.has(k)?'on':''}" data-e="${k}"><span class="pill ${k}">${EST[k]}</span><b>${fi(c[k])}</b></button>`).join('');
 let v=S.est.size?b.filter(r=>S.est.has(r[11])):b;
 if(S.sort!=null){const i=S.sort;v=v.slice().sort((a,b)=>{const x=a[i]??'',y=b[i]??'';return(x<y?-1:x>y?1:0)*(S.asc?1:-1)})}
 const P=300,np=Math.max(1,Math.ceil(v.length/P));S.page=Math.min(S.page,np-1);
 $('th').innerHTML='<tr>'+[['Estatus',11],['Dir.',1],['Tipo',2],['Fecha',3],['RFC contraparte',5],['Nombre',6],['Serie/Folio',7],['Total SAT',8],['Total MPRO',9],['Mon.',10],['Documento MPRO',12],['UUID',0],['Observación',14]].map(([n,i])=>`<th data-s="${i}">${n}${S.sort==i?(S.asc?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
 $('tb').innerHTML=v.slice(S.page*P,S.page*P+P).map(r=>`<tr data-u="${r[0]}"><td><span class="pill ${r[11]}">${EST[r[11]]}</span></td><td>${r[1]=='E'?'Emitido':'Recibido'}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[5]}</td><td title="${esc(r[6])}">${esc(r[6])}</td><td>${esc(r[7])}</td><td class="r">${fm(r[8])}</td><td class="r">${fm(r[9])}</td><td>${r[10]}</td><td title="${esc(r[12])}">${esc(r[12])}</td><td class="u">${r[0]}</td><td>${esc(r[14])}</td></tr>`).join('');
 $('pi').textContent=`Página ${S.page+1} de ${np}`;$('cnt').textContent=`${fi(v.length)} registros`;
 const av=$('aviso');av.hidden=full;av.textContent='Esta vista incluye solo los pendientes. Los conciliados y la nómina están disponibles en la versión del servidor LAN.';
 window._v=v;
}
function openDr(u){const r=D.rows.find(x=>x[0]==u)||rows.find(x=>x[0]==u);if(!r)return;const dif=(r[8]!=null&&r[9]!=null)?r[9]-r[8]:null;
 $('dr').innerHTML=`<button class="btn g" onclick="$('dr').classList.remove('on')">Cerrar</button><h3 style="margin-top:12px">${esc(r[6]||r[5]||'Comprobante')}</h3><span class="pill ${r[11]}">${EST[r[11]]}</span>
 <div class="cmp"><div><small>Total SAT</small><b>${r[8]==null?'—':'$'+fm(r[8])}</b></div><div><small>Total MPRO</small><b>${r[9]==null?'—':'$'+fm(r[9])}</b></div></div>
 ${dif!=null?`<div class="note" style="padding:0">Diferencia MPRO − SAT: <b>$${fm(dif)}</b></div>`:''}
 <dl><dt>UUID</dt><dd class="u">${r[0]}</dd><dt>Dirección</dt><dd>${r[1]=='E'?'Emitido por Trivasa':'Recibido por Trivasa'}</dd><dt>Tipo CFDI</dt><dd>${r[2]} · ${TCN[r[2]]||''}</dd><dt>Fecha</dt><dd>${r[3]}</dd><dt>RFC contraparte</dt><dd>${r[5]}</dd><dt>Nombre</dt><dd>${esc(r[6])}</dd><dt>Serie/Folio</dt><dd>${esc(r[7])}</dd><dt>Moneda</dt><dd>${r[10]}</dd><dt>Módulos MPRO</dt><dd>${esc(r[13])||'—'}</dd><dt>Documentos MPRO</dt><dd>${esc(r[12]).replace(/ \| /g,'<br>')||'—'}</dd><dt>Observación</dt><dd>${esc(r[14])||'—'}</dd></dl>`;$('dr').classList.add('on')}
document.addEventListener('click',e=>{const t=e.target.closest('[data-e],[data-m],[data-r],[data-s],[data-u],[data-v],[data-t]');if(!t)return;
 if(t.dataset.e!=null&&t.closest('.kpis,.chips')){const k=t.dataset.e;if(!k)S.est.clear();else S.est.has(k)?S.est.delete(k):S.est.add(k);S.page=0}
 else if(t.dataset.m){S.mes=S.mes==t.dataset.m?'':t.dataset.m;$('mes').value=S.mes;S.page=0}
 else if(t.dataset.r){S.q=t.dataset.r;$('q').value=S.q;S.page=0}
 else if(t.dataset.s){const i=+t.dataset.s;S.asc=S.sort==i?!S.asc:true;S.sort=i}
 else if(t.dataset.u){openDr(t.dataset.u);return}
 else if(t.closest('#dir')){S.dir=t.dataset.v;S.page=0}
 else return;render();syncDir()});
function syncDir(){document.querySelectorAll('#dir button').forEach(b=>b.classList.toggle('on',b.dataset.v==S.dir))}
$('tc').onchange=e=>{S.tc=e.target.value;S.page=0;render()};$('mes').onchange=e=>{S.mes=e.target.value;S.page=0;render()};
$('q').oninput=e=>{S.q=e.target.value;S.page=0;render()};
$('clr').onclick=()=>{Object.assign(S,{dir:'',tc:'',mes:'',q:'',page:0,sort:null});S.est.clear();$('tc').value=$('mes').value=$('q').value='';syncDir();render()};
$('pv').onclick=()=>{S.page=Math.max(0,S.page-1);render()};$('nx').onclick=()=>{S.page++;render()};
$('xls').onclick=()=>{const h=['Estatus','Dirección','Tipo','Fecha','RFC contraparte','Nombre','Serie/Folio','Total SAT','Total MPRO','Moneda','Documento MPRO','Módulo MPRO','UUID','Observación'];
 const a=[h].concat(window._v.map(r=>[EST[r[11]],r[1]=='E'?'Emitido':'Recibido',r[2],r[3],r[5],r[6],r[7],r[8],r[9],r[10],r[12],r[13],r[0],r[14]]));
 const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=h.map((x,i)=>({wch:[16,10,6,11,15,34,12,14,14,6,40,22,38,40][i]}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Conciliación');XLSX.writeFile(wb,'conciliacion_sat_mpro.xlsx')};
document.querySelectorAll('#theme button').forEach(b=>b.onclick=()=>{const t=b.dataset.t;t=='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=t;try{localStorage.setItem('th',t)}catch(e){}});
try{const t=localStorage.getItem('th');if(t&&t!='auto')document.documentElement.dataset.theme=t}catch(e){}
[...new Set(D.rows.map(r=>r[4]))].sort().forEach(m=>$('mes').insertAdjacentHTML('beforeend',`<option>${m}</option>`));
$('gen').textContent=`MPRO con timbres hasta ${D.corte} · generado ${D.generado}`;
full=D.completo;
if(!full&&location.protocol.startsWith('http')&&location.hostname!='')fetch('extra.json').then(r=>r.ok?r.json():Promise.reject()).then(x=>{D.rows=D.rows.filter(r=>r[0]).concat(x);rows=D.rows;full=true;render()}).catch(()=>{});
syncDir();render();
</script></body></html>
